f" stroke-width="3"/><text x="520" y="589" font-family="Arial,sans-serif" font-size="16" fill="#75645a">按住说话</text><line x1="56" y1="664" x2="684" y2="664" stroke="#e5d9cf"/><text x="90" y="704" font-family="Arial,sans-serif" font-size="13" fill="#a28d80">小满会在这里，认真听你说。</text></g></svg>
