<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">小满 AI 回信界面 mockup</title><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8dfd6"/><stop offset="1" stop-color="#efe8dd"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f8efe7"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#8d6251" flood-opacity=".18"/></filter></defs><rect width="1200" height="900" rx="34" fill="url(#b)"/><circle cx="1020" cy="160" r="130" fill="#f7c858" opacity=".35"/><g transform="translate(180 70) rotate(-5 280 360)" filter="url(#sh)"><rect width="560" height="760" rx="42" fill="#fffaf4" stroke="#d8c7bb" stroke-width="6"/><rect x="22" y="22" width="516" height="716" rx="30" fill="url(#s)"/><rect x="206" y="38" width="148" height="27" rx="14" fill="#322d2a"/><text x="48" y="120" font-family="Arial,sans-serif" font-size="17" fill="#a18d81">小满的回信</text><text x="48" y="160" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#403631">今天也辛苦你了。</text><text x="48" y="197" font-family="Arial,sans-serif" font-size="16" fill="#a07062">给五花的一封小信</text><rect x="48" y="236" width="464" height="230" rx="25" fill="#fffdf8" stroke="#eadfd6"/><circle cx="92" cy="282" r="22" fill="#f4c557"/><path d="M92 267l6 11 12 2-9 8 2 12-11-6-11 6 2-12-9-8 12-2Z" fill="#fff5c5"/><text x="132" y="286" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5a4e47">灵感 AI</text><text x="78" y="347" font-family="Arial,sans-serif" font-size="18" fill="#564941">我听见你说，今天像是</text><text x="78" y="382" font-family="Arial,sans-serif" font-size="18" fill="#564941">有一件小事终于落地。</text><text x="78" y="424" font-family="Arial,sans-serif" font-size="16" fill="#856f63">不用急着总结，先给自己</text><text x="78" y="449" font-family="Arial,sans-serif" font-size="16" fill="#856f63">一点可以呼吸的时间。</text><rect x="48" y="496" width="464" height="90" rx="22" fill="#f9e1d8"/><text x="78" y="530" font-family="Arial,sans-serif" font-size="12" fill="#a96f60">今日情绪</text><text x="78" y="559" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#cc6047">松了一点 · 72%</text><path d="M338 556c32-36 51 32 76-4 22-32 42 11 70-14" fill="none" stroke="#df795d" stroke-width="5" stroke-linecap="round"/><line x1="48" y1="624" x2="512" y2="624" stroke="#eadfd6"/><text x="48" y="672" font-family="Arial,sans-serif" font-size="14" fill="#9d887a">写下下一句 →</text></g><g transform="translate(900 520)"><path d="M62 0c14 28 31 34 63 36-22 15-26 35-17 62-24-14-44-6-65 13 4-30-10-46-34-62 30-5 42-22 53-49Z" fill="#efb83c"/><circle cx="59" cy="49" r="5" fill="#4f342d"/><circle cx="91" cy="49" r="5" fill="#4f342d"/><path d="M66 65q10 13 20 0" fill="none" stroke="#4f342d" stroke-width="4" stroke-linecap="round"/></g></svg>
