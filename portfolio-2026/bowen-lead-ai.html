<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}body{margin:0;background:#fafaf9;color:#1d2129;font-family:Inter,"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}::selection{background:#165dff;color:#fff}.serif{font-family:Georgia,"Songti SC",serif}.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.is-visible{opacity:1;transform:none}.image-card{transition:transform .4s ease,box-shadow .4s ease}.image-card:hover{transform:translateY(-5px);box-shadow:0 24px 55px rgba(32,42,60,.12)}.nav-link{position:relative}.nav-link:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#165dff;transform:scaleX(0);transform-origin:left;transition:transform .25s}.nav-link.active{color:#165dff;font-weight:700}.nav-link.active:after{transform:scaleX(1)}.modal-backdrop{background:rgba(17,24,39,.58);backdrop-filter:blur(8px)}
.hero-stage{position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(117,129,147,.18);background:linear-gradient(135deg,#f8fafc 0%,#edf1f5 45%,#f7f8fa 100%);box-shadow:inset 0 1px rgba(255,255,255,.9),0 24px 70px rgba(31,50,78,.09)}
.hero-stage:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 48%,rgba(22,93,255,.14),transparent 39%),radial-gradient(circle at 13% 9%,rgba(255,255,255,.92),transparent 33%)}
.stage-grid{position:absolute;inset:0;z-index:1;opacity:.35;background-image:linear-gradient(rgba(115,128,148,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(115,128,148,.12) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 80%)}.hero-stage>*:not(.stage-grid){position:relative;z-index:2}
.stage-rail{display:flex;align-items:center;gap:12px;color:#6b7585;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.stage-rail:before{content:"";display:block;width:26px;height:1px;background:#165dff;box-shadow:0 0 12px rgba(22,93,255,.65)}
.stage-chip{border:1px solid rgba(22,93,255,.2);background:rgba(255,255,255,.62);box-shadow:0 7px 18px rgba(31,50,78,.06);backdrop-filter:blur(8px)}
.presentation-frame{overflow:hidden;border:1px solid rgba(117,129,147,.2);border-radius:22px;background:#eef1f4;box-shadow:0 24px 70px rgba(31,50,78,.12),inset 0 1px rgba(255,255,255,.92)}.presentation-frame button{display:block;width:100%;cursor:zoom-in}.presentation-frame img{display:block;width:100%;height:auto}
.monitor-shell{transform:perspective(1400px) rotateX(.6deg);transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .55s ease}.monitor-shell:hover{transform:perspective(1400px) rotateX(.6deg) translateY(-7px) scale(1.008);filter:drop-shadow(0 28px 30px rgba(31,50,78,.15))}.monitor-screen{box-shadow:0 25px 55px rgba(31,50,78,.2),0 0 0 1px rgba(255,255,255,.5) inset}.monitor-screen:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -34px 60px rgba(16,29,51,.08)}
.section-ruler{position:relative}.section-ruler:before{content:"";display:block;width:44px;height:2px;margin-bottom:18px;background:#165dff;box-shadow:0 0 14px rgba(22,93,255,.35)}

/* Figma fidelity: keep the canvas quiet and match the reference frame. */
.presentation-frame{overflow:hidden;border:0;border-radius:12px;background:transparent;box-shadow:none}
.presentation-frame button{display:block;width:100%;cursor:zoom-in}
.presentation-frame img{display:block;width:100%;height:auto}
.section-ruler{position:relative;padding-left:0}
.section-ruler:before,.section-ruler:after{display:none!important}
.image-card{transition:transform .28s ease,box-shadow .28s ease}
.image-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,50,78,.08)}
.nav-link{position:relative}
.nav-link:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#165dff;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-link.active{color:#165dff;font-weight:700}
.nav-link.active:after{transform:scaleX(1)}
.modal-backdrop{background:rgba(17,24,39,.58);backdrop-filter:blur(8px)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.image-card,.nav-link:after{transition:none}}

<script>Object.assign(window.LEAD,{upload:'assets/figma-lead-ai/interface-upload-clean.png',config:'assets/figma-lead-ai/interface-config-clean.png',outline:'assets/figma-lead-ai/interface-outline-clean.png',writing:'assets/figma-lead-ai/interface-writing-clean.png',library:'assets/figma-lead-ai/interface-library-clean.png',review:'assets/figma-lead-ai/interface-review-overview-clean.png',detail:'assets/figma-lead-ai/interface-review-detail-clean.png',account:'assets/figma-lead-ai/interface-account-clean.png'})</script>
<script type="text/babel">
const {useEffect,useRef,useState}=React, A=window.LEAD;
const chapters=[['overview','项目概览'],['problem','理解问题'],['decisions','设计决策'],['workflow','核心流程'],['expression','方案展示'],['prototype','交互原型'],['reflection','项目思考']];
function Reveal({children, className=''}){const ref=useRef();useEffect(()=>{const n=ref.current;if(!n)return;const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){n.classList.add('is-visible');io.disconnect()}},{threshold:.1});io.observe(n);return()=>io.disconnect()},[]);return <div ref={ref} className={'reveal '+className}>{children}</div>}
function E({children,blue=false}){return <p className={'text-[12px] tracking-[.08em] '+(blue?'text-blue':'text-muted')}>{children}</p>}
function Head({n,k,title,lead}){return <div className="grid gap-8 pb-7 mb-12 lg:grid-cols-[minmax(0,.72fr)_minmax(260px,.28fr)] lg:items-end"><div className="section-ruler"><E>{n} / {k}</E><h2 className="mt-4 text-[clamp(2.1rem,4.5vw,3.55rem)] font-semibold leading-[1.22] tracking-[-.045em]">{title}</h2></div><p className="text-[15px] leading-[1.85] text-muted">{lead}</p></div>}
function Shot({src,alt,open,wide=''}){return <button type="button" onClick={()=>open(src)} className={'group relative block w-full overflow-hidden rounded-[16px] bg-white text-left image-card '+wide}><img src={src} alt={alt} className="block h-full w-full rounded-[inherit] object-contain"/><span className="absolute right-4 top-4 rounded-full bg-white/90 px-3 py-1.5 text-[11px] text-muted opacity-0 shadow group-hover:opacity-100">查看大图 ↗</span></button>}
function App(){const [active,setActive]=useState('overview'),[modal,setModal]=useState(null);useEffect(()=>{const on=()=>{let c='overview';chapters.forEach(([id])=>{const e=document.getElementById(id);if(e&&scrollY+150>=e.offsetTop)c=id});setActive(c)};addEventListener('scroll',on,{passive:true});on();return()=>removeEventListener('scroll',on)},[]);return <div className="min-h-screen bg-paper">
<a href="#content" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-blue focus:px-4 focus:py-2 focus:text-white">跳到正文</a>
<header className="mx-auto flex h-[44px] w-full max-w-[1440px] items-center justify-between px-6 pt-0 mt-8 text-[13px] text-muted lg:px-24"><a href="bowen-portfolio.html#work" className="hover:text-blue">← 返回作品集 / Back to portfolio</a><span className="font-mono text-[12px]">2026</span></header>
<main id="content">
<section className="mx-auto w-full max-w-[1440px] px-6 pb-0 pt-11 lg:px-24 lg:pt-11"><Reveal><E>UX CASE STUDY / AI PRODUCT DESIGN</E></Reveal><Reveal><div className="mt-7 grid items-center gap-12 lg:grid-cols-[480px_1fr] lg:gap-16"><div><h1 className="text-[clamp(4.25rem,9vw,7rem)] font-bold leading-[.95] tracking-[-.08em]">领标 AI</h1><p className="mt-3 text-[14px] tracking-[.16em] text-muted">LINGBIAO AI</p></div><p className="text-[clamp(1.6rem,3vw,2.15rem)] font-medium leading-[1.55]">让复杂的投标工作，<br/>成为可控的 AI 协作流程。</p></div></Reveal><Reveal><div className="mt-10 grid grid-cols-2 gap-x-8 gap-y-5 border-t border-line pt-5 sm:grid-cols-4">{[['年份','2026'],['角色','主导体验设计'],['阶段','0→1 · 待上线'],['类型','B端 AI SaaS']].map(x=><div key={x[0]}><p className="text-[11px] text-muted">{x[0]}</p><p className="mt-1 text-[14px]">{x[1]}</p></div>)}</div></Reveal><Reveal><div className="presentation-frame mt-11"><button type="button" onClick={()=>setModal(A.hero)} aria-label="查看领标 AI 高清展示图"><img src={A.hero} alt="领标 AI 正文工作台银灰展台展示图"/></button></div></Reveal><nav className="mt-11 flex gap-11 overflow-x-auto border-b border-line">{chapters.map(x=><a key={x[0]} href={'#'+x[0]} className={'nav-link flex h-[72px] shrink-0 items-center text-[13px] '+(active===x[0]?'active':'text-muted')}>{x[1]}</a>)}</nav></section>
<section id="overview" className="bg-white"><div className="mx-auto grid w-full max-w-[1440px] gap-10 px-6 py-24 lg:grid-cols-[280px_1fr] lg:gap-20 lg:px-24 lg:py-28"><div><E>A / PROJECT OVERVIEW</E><h2 className="mt-5 text-[32px] font-bold">项目概览</h2></div><div><h3 className="max-w-[800px] text-[clamp(1.8rem,3.2vw,2rem)] font-medium leading-[1.55]">不是让 AI 替人写完，<br/>而是让每一步都可理解、可确认、可调整。</h3><p className="mt-7 max-w-[820px] text-[17px] leading-[1.85] text-muted">领标 AI 是面向企业投标的桌面 AI 撰写工作台，串联招标文件解析、写作配置、大纲确认、正文生成、知识复用与查重审查。我主导从用户研究、信息架构到交互与视觉设计，重点是为高风险、长周期的专业任务建立可控的 AI 协作流程。</p><p className="mt-5 max-w-[820px] text-[15px] leading-[1.85] text-muted">企业投标混合了复杂要求、分散的历史文档与多人审阅。单纯加快文字生成，并不能解决材料组织、结构判断与最终质量之间的断点。</p><div className="mt-12 grid gap-6 border-t border-line pt-7 sm:grid-cols-4">{['用户研究','信息架构','交互设计','视觉设计'].map(x=><span key={x} className="text-[16px]">{x}</span>)}</div></div></div></section>
<section id="problem" className="mx-auto w-full max-w-[1440px] px-6 py-24 lg:px-24 lg:py-28"><Head n="B" k="UNDERSTANDING THE PROBLEM" title={<>真正复杂的，<br/>不只是写作。</>} lead="从理解招标要求，到组织材料与最终审阅，投标是一条高责任、强依赖的工作链。"/><p className="mb-7 text-[12px] text-muted">原项目研究记录 / 以下为原项目所载研究规模，非独立核验</p><div className="grid gap-px border border-line bg-line sm:grid-cols-2 lg:grid-cols-4">{[['12','人深度访谈'],['3','家现场观察'],['9','款竞品分析'],['218','份定量问卷']].map(x=><div key={x[1]} className="bg-white p-6"><p className="text-5xl font-medium tracking-[-.06em]">{x[0]}</p><p className="mt-3 text-[14px] text-muted">{x[1]}</p></div>)}</div><div className="mt-16 grid gap-10 lg:grid-cols-3">{[['高频 / 专业主导','专业标书工程师','需要深度控制，而非黑箱输出。'],['兼任 / 任务驱动','兼写标书的销售负责人','需要合理起点，而非复杂选项。'],['低频 / 每次重要','没有专职团队的企业主','需要流程指引，而非术语堆叠。']].map(x=><article key={x[0]} className="border-t border-line pt-5"><p className="text-[12px] text-muted">{x[0]}</p><h3 className="mt-5 text-[20px] font-semibold">{x[1]}</h3><p className="mt-3 text-[14px] leading-[1.8] text-muted">{x[2]}</p></article>)}</div><div className="mt-16 border-t border-line pt-8"><p className="text-[12px] text-muted">一份标书，六个连续的断点</p><div className="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-6">{[['01','接到任务','评分要求埋在 PDF 与附件中'],['02','拆解需求','章节结构每次重新搭建'],['03','找历史素材','历史标书分散，查找费力'],['04','写正文','协作文字与图表口径不一'],['05','查重排版','人工比对与格式检查繁琐'],['06','提交等待','失败原因难以回溯']].map(x=><div key={x[0]} className="border-l-2 border-blue pl-4"><span className="font-mono text-[12px] text-blue">{x[0]}</span><h3 className="mt-3 text-[15px] font-semibold">{x[1]}</h3><p className="mt-2 text-[12px] leading-[1.7] text-muted">{x[2]}</p></div>)}</div></div><p className="mt-10 text-[12px] tracking-[.08em] text-blue">知识碎片化 × 重复劳动 × AI 不确定性 × 审查复杂度</p></section>
<section id="decisions" className="bg-white"><div className="mx-auto w-full max-w-[1440px] px-6 py-24 lg:px-24 lg:py-28"><Head n="C" k="INSIGHTS TO DECISIONS" title={<>让每一个断点，<br/>对应一个设计选择。</>} lead="设计回应不是功能清单，而是把每个不确定性放到合适的确认点。"/><div className="grid gap-8 lg:grid-cols-2">{[['AI 的输出存在不确定性','可见确认点与人工干预','把判断留给用户，而非把整份标书一次性交给黑箱。'],['专家与新手的能力差异','合理默认值与渐进披露','让新手先完成任务，也为专业用户保留精细控制。'],['历史材料分散在不同项目','独立知识库','把组织、查找与引用从单次写作中独立出来。'],['问题往往在交付前才暴露','在配置与审查中前置风险','生成前明确要求，生成后按风险定位问题与修改入口。'],['长任务会等待，也会被打断','清晰进度与可恢复路径','以保留状态、恢复任务为设计目标，降低过程中的不确定感。']].map(x=><div key={x[0]} className="grid gap-4 border-t border-line pt-5 sm:grid-cols-2"><p className="text-[15px] text-muted">{x[0]}</p><div><p className="text-[18px] font-semibold">{x[1]}</p><p className="mt-2 text-[14px] leading-[1.8] text-muted">{x[2]}</p></div></div>)}</div><div className="mt-16 border-l-2 border-blue bg-[#f5f7fb] px-6 py-6 lg:px-8"><p className="text-[12px] tracking-[.08em] text-blue">THE DELIBERATE TRADE-OFF</p><p className="mt-5 text-[clamp(1.6rem,3vw,2.1rem)] font-medium leading-[1.5]">多一步大纲确认，<br/>换取生成前的结构控制。</p><p className="mt-4 max-w-[720px] text-[15px] leading-[1.85] text-muted">我选择分阶段确认，而不是追求「一键完成」的表面便利。效率不能以失去判断权为代价。</p></div></div></section>
<section id="workflow" className="mx-auto w-full max-w-[1440px] px-6 py-24 lg:px-24 lg:py-28"><Head n="D" k="CORE WORKFLOW" title={<>把复杂任务，<br/>拆成可以确认的四步。</>} lead="设计意图：让进度与确认点可见；状态保留与任务恢复路径仍需在实现及后续测试中验证。"/><div className="grid gap-px border border-line bg-line sm:grid-cols-2 lg:grid-cols-4">{[['01','上传与解析','理解任务输入'],['02','配置与确认','明确生成边界'],['03','大纲生成与编辑','先审结构，再生成正文'],['04','正文撰写与审查','协作完善与检查']].map(x=><article key={x[0]} className="bg-white p-7"><span className="font-mono text-[12px] text-blue">{x[0]}</span><h3 className="mt-12 text-[20px] font-semibold">{x[1]}</h3><p className="mt-3 text-[14px] text-muted">{x[2]}</p></article>)}</div></section>
<section id="expression" className="bg-white"><div className="mx-auto w-full max-w-[1440px] px-6 py-24 lg:px-24 lg:py-28"><Head n="E · 01" k="CONTROLLED GENERATION" title={<>用户先决定结构，<br/><span className="serif font-normal text-blue">AI 再展开内容。</span></>} lead="从上传到写作，把一次难以撤回的大动作拆成连续的小判断；让用户在投入长文生成之前，先确认方向。"/><div className="grid gap-14 lg:grid-cols-2"><div><div className="flex items-center justify-between"><p className="text-[20px] font-semibold">01 上传与解析</p><button onClick={()=>setModal(A.upload)} className="text-[12px] text-blue">查看大图 ↗</button></div><Shot src={A.upload} alt="上传与解析界面" open={setModal} wide="mt-4 aspect-[660/640]"/><p className="mt-4 text-[14px] leading-[1.85] text-muted">阶段标签先说明接下来会发生什么；拖拽或点击上传招标文件，也可从历史项目导入。补充材料与知识库增强各有入口，避免把所有输入混在一步里。</p></div><div><div className="flex items-center justify-between"><p className="text-[20px] font-semibold">02 写作配置</p><button onClick={()=>setModal(A.config)} className="text-[12px] text-blue">查看大图 ↗</button></div><Shot src={A.config} alt="写作配置界面" open={setModal} wide="mt-4 aspect-[660/575]"/><p className="mt-4 text-[14px] leading-[1.85] text-muted">把篇幅、质量、风格、表格、配图与相似性设置集中呈现。默认值承接新手，可展开的精细控制和预览承接专家。</p></div></div><div className="mt-24 grid items-center gap-8 lg:grid-cols-[1fr_1.1fr]"><div><E blue>THE HUMAN CHECKPOINT</E><h3 className="mt-4 text-[clamp(1.8rem,3vw,2.25rem)] font-medium leading-[1.5]">先审结构，再生成正文。</h3><p className="mt-4 max-w-[450px] text-[15px] leading-[1.85] text-muted">大纲不是过程中的一闪而过，而是明确的确认关口。用户可手动确认、编辑与调整顺序，识别关键评分章节，再决定是否进入正文生成。</p></div><Shot src={A.outline} alt="大纲生成与编辑界面" open={setModal} wide="aspect-[1024/841]"/></div><div className="mt-12 grid gap-8 border-t border-line pt-7 sm:grid-cols-3">{[['关键章节可见','帮助用户核对评分要求，避免只检查有没有内容，却忽略内容的重要性。'],['建议不替代决策','合并、拆分、增补与 AI 调整作为辅助建议，由用户决定结构是否成立。'],['生成前可调整','把判断留在投入长文生成之前，让每一步都可撤回。']].map(x=><div key={x[0]}><h4 className="text-[17px] font-semibold">{x[0]}</h4><p className="mt-2 text-[13px] leading-[1.75] text-muted">{x[1]}</p></div>)}</div><div className="mt-24 grid gap-10 lg:grid-cols-[.86fr_1.14fr] lg:items-center"><div><E blue>从等待结果，到参与写作过程。</E><h3 className="mt-4 text-[clamp(1.8rem,3vw,2.25rem)] font-medium leading-[1.5]">04 正文撰写工作台</h3><p className="mt-4 max-w-[460px] text-[15px] leading-[1.85] text-muted">左侧目录保留长文结构，中间呈现流式生成进度，右侧顾问承接检查、表达与引用补全的辅助意图。</p></div><Shot src={A.writing} alt="正文撰写工作台界面" open={setModal} wide="aspect-[1024/886]"/></div><div className="mt-24 border-t border-line pt-12"><E>E · 02 / A REUSABLE KNOWLEDGE BASE</E><h3 className="mt-4 text-[clamp(1.9rem,3vw,2.35rem)] font-medium">从反复翻找，到持续复用。</h3><p className="mt-4 max-w-[720px] text-[15px] leading-[1.85] text-muted">将历史材料转化为可复用知识。独立知识库把材料组织、查找与引用连接起来，让企业表达有积累的空间。</p><div className="mt-10 grid items-start gap-10 lg:grid-cols-[1.05fr_.95fr]"><Shot src={A.library} alt="知识库材料导入与组织界面" open={setModal} wide="aspect-[1024/757]"/><div><p className="text-[12px] text-blue">从文件到可引用的学习状态 · 原界面局部</p><h4 className="mt-4 text-[clamp(1.8rem,3vw,2.2rem)] font-medium leading-[1.5]">让资料的准备状态，<br/>成为可读的信息。</h4><p className="mt-5 text-[15px] leading-[1.85] text-muted">学习中、学习成功与可引用等状态，让用户不必猜测上传是否已经完成。来源分类与文件管理入口，保留材料的上下文。</p><div className="mt-8 grid gap-4 sm:grid-cols-3">{[['组织','按行业、年份、用途建立线索'],['查找','从项目与模板两条路径进入'],['复用','在写作前挂载可引用资料']].map(x=><div key={x[0]} className="border-t border-line pt-4"><p className="font-semibold">{x[0]}</p><p className="mt-2 text-[13px] leading-[1.7] text-muted">{x[1]}</p></div>)}</div></div></div></div><div className="mt-24 border-t border-line pt-12"><E>E · 03 / REVIEW TO RESOLUTION</E><h3 className="mt-4 text-[clamp(1.9rem,3vw,2.35rem)] font-medium">让问题可见，也让修改有入口。</h3><p className="mt-4 max-w-[720px] text-[15px] leading-[1.85] text-muted">人工比对费力，单个相似度数字也无法告诉用户该改哪里。审查设计把上传比对、风险定位、相似来源与局部改写连接成一条路径。</p><div className="mt-10 grid gap-10 lg:grid-cols-2"><div><p className="text-[12px] text-blue">审查概览 / 上传比对与历史记录</p><Shot src={A.review} alt="审查概览界面" open={setModal} wide="mt-4 aspect-[980/915]"/><h4 className="mt-6 text-[22px] font-medium">先明确比对对象，再进入风险定位。</h4><p className="mt-3 text-[14px] leading-[1.8] text-muted">招标文件与投标文件以并列入口上传，减少对象混淆；历史记录保留查重状态与结果入口。</p></div><div><p className="text-[12px] text-blue">审查详情 / 风险、来源与 AI 改写建议</p><Shot src={A.detail} alt="审查详情界面" open={setModal} wide="mt-4 aspect-[1024/835]"/><h4 className="mt-6 text-[22px] font-medium">从发现问题，到有依据地修改。</h4><p className="mt-3 text-[14px] leading-[1.8] text-muted">高风险优先呈现，历史相似来源与当前段落并置，支持核对重复内容上下文，发现问题后直接进入改写。</p></div></div></div><div className="mt-24 border-t border-line pt-12"><E>E · 04 / TRANSPARENT USAGE</E><h3 className="mt-4 text-[clamp(1.9rem,3vw,2.35rem)] font-medium">让使用成本成为可理解的信息。</h3><p className="mt-4 max-w-[720px] text-[15px] leading-[1.85] text-muted">字数额度、订阅期限与交易状态是持续使用的一部分。把它们从模糊的提醒，整理成用户可以主动核查的信息。</p><div className="mt-8 grid gap-5 border-t border-line pt-7 sm:grid-cols-3">{[['额度可见','以进度与剩余额度共同表达使用情况。'],['订阅期限清楚','将到期时间、剩余天数与续期入口联系起来。'],['交易记录可查','按时间筛选购买记录，清楚区分支付与退款状态。']].map(x=><div key={x[0]}><h4 className="text-[17px] font-semibold">{x[0]}</h4><p className="mt-2 text-[13px] leading-[1.75] text-muted">{x[1]}</p></div>)}</div><Shot src={A.account} alt="账户与用量界面" open={setModal} wide="mt-10 aspect-[1024/820]"/><p className="mt-4 text-[12px] text-muted">界面中的额度、金额与日期为原型示例数据，不代表产品经营结果。</p></div></div></section>
<section id="prototype" className="bg-paper"><div className="mx-auto grid w-full max-w-[1440px] gap-12 px-6 py-24 lg:grid-cols-2 lg:items-center lg:px-24 lg:py-28"><div><E>F / INTERACTIVE PROTOTYPE</E><h2 className="mt-5 text-[clamp(2.2rem,4vw,3.3rem)] font-semibold leading-[1.25]">沿着一份标书，<br/><span className="serif font-normal text-blue">走进完整流程。</span></h2><p className="mt-6 text-[13px] text-muted">交互原型 · 非已上线产品</p><p className="mt-4 text-[17px] leading-[1.8] text-muted">从文件上传开始，理解每一步的确认与协作。</p><a href="https://lead-bid-ai-new-bid-12lk.bolt.host/" target="_blank" rel="noreferrer" className="mt-8 inline-flex min-h-11 items-center rounded-full bg-blue px-6 text-[13px] font-semibold text-white shadow-lg shadow-blue/20 transition hover:-translate-y-0.5 hover:bg-[#0e4ed8]">体验交互原型 ↗</a></div><Shot src={A.upload} alt="交互原型入口预览" open={setModal} wide="aspect-[660/640]"/></div></section>
<section id="reflection" className="bg-white"><div className="mx-auto w-full max-w-[1440px] px-6 py-24 lg:px-24 lg:py-28"><Head n="G" k="REFLECTION & NEXT QUESTIONS" title={<>设计 AI 能力，<br/>更要设计人的判断位置。</>} lead="完成 0→1 体验方案，尚未正式上线。案例呈现设计方案与判断过程，预期价值尚不能视为经过生产环境验证的结果。"/><div className="grid gap-10 lg:grid-cols-3">{[['AI 协作的核心是控制感','这次设计让我更关注「人在哪一步做判断」，而不只是 AI 能生成多少内容。把结构确认与局部修改放到台前，才能让专业责任与自动化共存。'],['默认值与深度并不矛盾','我用默认值降低新手的起步门槛，也为专家保留进一步配置和人工干预。渐进披露不是减少能力，而是让能力在需要时出现。'],['复杂流程需要被重新组织','从材料到结构、正文与审查，我尝试围绕任务拆解信息架构。每一步都要知道输入是什么、正在发生什么，以及下一步由谁决定。']].map(x=><article key={x[0]} className="border-t border-line pt-5"><h3 className="text-[19px] font-semibold">{x[0]}</h3><p className="mt-3 text-[14px] leading-[1.85] text-muted">{x[1]}</p></article>)}</div><div className="mt-16 border-t border-line pt-6"><p className="text-[12px] tracking-[.08em] text-blue">NEXT / 尚待验证</p><h3 className="mt-4 text-[clamp(1.8rem,3vw,2.2rem)] font-medium">下一步，我想确认</h3><div className="mt-6 grid gap-4 sm:grid-cols-3">{['用户是否真正理解大纲确认的意义，而不是直接跳过？','长任务被中断后，用户能否理解状态并顺利恢复？','知识库的组织方式，能否帮助用户找到并引用合适材料？'].map((x,i)=><p key={x} className="border-t border-line pt-4 text-[14px] leading-[1.8] text-muted">{String(i+1).padStart(2,'0')}  {x}</p>)}</div></div></div></section>
</main>
<footer className="mx-auto flex w-full max-w-[1440px] flex-col gap-10 px-6 py-14 lg:flex-row lg:items-end lg:justify-between lg:px-24"><div><E>NEXT / KEEP IN PLAY</E><h2 className="mt-5 text-[clamp(2.2rem,4vw,3.4rem)] font-semibold leading-[1.2]">把复杂，打出<br/><span className="serif font-normal text-blue">清晰的落点。</span></h2><p className="mt-6 text-[11px] text-muted">LINGBIAO AI / UX CASE STUDY / 2026</p></div><div className="flex flex-wrap gap-3"><a href="bowen-portfolio.html#work" className="inline-flex min-h-11 items-center rounded-full border border-line px-5 text-[13px] text-muted hover:border-blue hover:text-blue">← 回到全部作品</a><a href="bowen-portfolio.html#contact" className="inline-flex min-h-11 items-center rounded-full bg-blue px-5 text-[13px] font-semibold text-white hover:-translate-y-0.5 hover:bg-[#0e4ed8]">聊聊下一个项目 ↗</a></div></footer>
{modal&&<div className="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-5" onClick={()=>setModal(null)}><div className="relative max-h-[92vh] max-w-[1200px] overflow-auto rounded-xl bg-white p-3 shadow-2xl" onClick={e=>e.stopPropagation()}><button onClick={()=>setModal(null)} className="sticky right-3 top-3 float-right z-10 rounded-full bg-white px-3 py-1 text-[12px] text-muted shadow">关闭 ×</button><img src={modal} alt="放大后的领标 AI 界面" className="max-h-[86vh] w-auto rounded-lg object-contain"/></div></div>}
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
